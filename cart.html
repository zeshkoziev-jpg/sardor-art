<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savat — SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>
  <main class="container">
    <h1 data-i18n="cart_title">Savat</h1>
    <div id="cart-area"></div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
    window.initCart = function () {
      const t = window.t;
      const area = document.getElementById('cart-area');

      function render() {
        const cart = getCart();
        if (!cart.length) {
          area.innerHTML = `<p class="muted" data-i18n="cart_empty">${esc(t('cart_empty'))}</p>`;
          return;
        }
        area.innerHTML = `
          <div id="cart-list"></div>
          <div class="total">
            <span data-i18n="total">${esc(t('total'))}:</span>
            <span class="amount">${esc(fmtMoney(cartTotal()))}</span>
          </div>
          <div class="row" style="justify-content:flex-end">
            <button id="go-checkout" class="btn primary" data-i18n="checkout">${esc(t('checkout'))}</button>
          </div>
        `;
        const list = document.getElementById('cart-list');
        list.innerHTML = cart.map((it) => `
          <div class="cart-item" data-id="${esc(it.id)}">
            <img src="${esc(it.image)}" alt="${esc(it.name)}">
            <div>
              <div class="title">${esc(it.name)}</div>
              <div class="muted">${esc(fmtMoney(it.price))}</div>
            </div>
            <div class="qty">
              <button data-act="dec">−</button>
              <span>${esc(it.qty)}</span>
              <button data-act="inc">+</button>
            </div>
            <div class="right">
              <button class="btn danger" data-act="rm" data-i18n="remove">${esc(t('remove'))}</button>
            </div>
          </div>
        `).join('');

        list.querySelectorAll('.cart-item').forEach((row) => {
          const id = row.getAttribute('data-id');
          const item = getCart().find((x) => x.id === id);
          if (!item) return;
          row.querySelector('[data-act="inc"]').addEventListener('click', () => {
            setQty(id, Number(item.qty) + 1); render();
          });
          row.querySelector('[data-act="dec"]').addEventListener('click', () => {
            if (Number(item.qty) <= 1) return;
            setQty(id, Number(item.qty) - 1); render();
          });
          row.querySelector('[data-act="rm"]').addEventListener('click', () => {
            removeFromCart(id); render();
          });
        });

        const btn = document.getElementById('go-checkout');
        if (btn) btn.addEventListener('click', () => {
          if (!getAuth()) {
            toast(t('login_needed'), 'error');
            setTimeout(() => location.href = '/login', 600);
            return;
          }
          location.href = '/checkout';
        });
      }

      render();
      document.addEventListener('cartchange', render);
      document.addEventListener('langchange', render);
    };
  </script>
</body>
</html>
