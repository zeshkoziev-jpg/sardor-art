<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Savdogar — SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="seller">
  <div id="site-header"></div>
  <main class="container">
    <h1 data-i18n="seller_title">Savdogar paneli</h1>
    <div id="seller-area"></div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
    window.initSeller = function () {
      const t = window.t;
      const area = document.getElementById('seller-area');
      const user = getAuth();
      if (!user) {
        area.innerHTML = `<p class="muted">${esc(t('login_needed'))}</p>
          <a class="btn primary mt-2" href="/login">${esc(t('login_title'))}</a>`;
        return;
      }
      if (user.role !== 'seller') {
        area.innerHTML = `<p class="muted">${esc(t('access_denied'))}. <a href="/profile">${esc(t('profile'))}</a></p>`;
        return;
      }

      area.innerHTML = `
        <div class="sold-card">
          <h2 data-i18n="create">Yaratish</h2>
          <div class="form">
            <label data-i18n="product_name">Asar nomi</label>
            <input id="p-name" class="input" maxlength="80">
            
            <!-- Yangi: Janr tanlash -->
            <label>Asar janri</label>
            <select id="p-genre" class="input">
              <option value="Manzara">Manzara</option>
              <option value="Portret">Portret</option>
              <option value="Abstrakt">Abstrakt</option>
              <option value="Natyurmort">Natyurmort</option>
              <option value="Realizm">Realizm</option>
              <option value="Zamonaviy">Zamonaviy</option>
              <option value="Boshqa">Boshqa</option>
            </select>

            <label data-i18n="price">Narx (so'm)</label>
            <input id="p-price" class="input" type="number" min="1" max="1000000000" step="1">

            <!-- Yangi: To'lov turi -->
            <label>To'lov turi</label>
            <select id="p-payment" class="input">
              <option value="100% oldindan">100% oldindan</option>
              <option value="50% oldindan, 50% keyin">50% oldindan, 50% keyin</option>
              <option value="100% keyin">100% keyin</option>
            </select>

            <label data-i18n="image">Rasm</label>
            <input id="p-file" type="file" accept="image/jpeg,image/png,image/webp">
            <img id="p-preview" class="hidden" style="max-width:220px;border-radius:10px;margin-top:8px" alt="">
            <label class="row" style="gap:8px">
              <input id="p-public" type="checkbox" checked>
              <span data-i18n="make_public">Ommaga taqdim etish</span>
            </label>
            <button id="p-create" class="btn primary" data-i18n="create">Yaratish</button>
            <div id="p-msg" class="error-text"></div>
          </div>
        </div>
        <div class="mt-2">
          <h2 data-i18n="my_works">Mening asarlarim</h2>
          <div id="works"></div>
        </div>
      `;

      const nameEl = document.getElementById('p-name');
      const priceEl = document.getElementById('p-price');
      const genreEl = document.getElementById('p-genre');
      const paymentEl = document.getElementById('p-payment');
      const fileEl = document.getElementById('p-file');
      const preview = document.getElementById('p-preview');
      const pubEl = document.getElementById('p-public');
      const createBtn = document.getElementById('p-create');
      const msgEl = document.getElementById('p-msg');
      const worksEl = document.getElementById('works');

      let pendingFile = null;

      function resizeToJpeg(file, maxSide = 900, quality = 0.85) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * scale));
              const h = Math.max(1, Math.round(img.height * scale));
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#fff';
              ctx.fillRect(0, 0, w, h);
              ctx.drawImage(img, 0, 0, w, h);
              try {
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                const base64 = dataUrl.split(',')[1] || '';
                resolve({ base64, type: 'image/jpeg', dataUrl });
              } catch (e) { reject(e); }
            };
            img.onerror = reject;
            img.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      fileEl.addEventListener('change', async () => {
        msgEl.textContent = '';
        const f = fileEl.files && fileEl.files[0];
        if (!f) { pendingFile = null; preview.classList.add('hidden'); return; }
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) {
          msgEl.textContent = 'Faqat JPEG/PNG/WEBP'; return;
        }
        if (f.size > 6 * 1024 * 1024) {
          msgEl.textContent = 'Rasm 6MB dan oshmasin'; return;
        }
        try {
          const res = await resizeToJpeg(f, 900, 0.85);
          pendingFile = res;
          preview.src = res.dataUrl;
          preview.classList.remove('hidden');
        } catch (e) {
          msgEl.textContent = t('error_generic');
        }
      });

      async function renderWorks() {
        try {
          const j = await api('/api/seller/products');
          if (!j.products.length) {
            worksEl.innerHTML = `<p class="muted">${esc(t('no_works'))}</p>`;
            return;
          }
          worksEl.innerHTML = `<div class="grid">${j.products.map((p) => `
            <div class="card" data-id="${esc(p.id)}">
              <div class="thumb"><img src="${esc(p.image)}" alt="${esc(p.name)}"></div>
              <div class="body">
                <div class="title">${esc(p.name)}</div>
                <div class="muted" style="font-size:12px">Janr: ${esc(p.genre)}</div>
                <div class="muted" style="font-size:12px">To'lov: ${esc(p.paymentType)}</div>
                <div class="price">${esc(fmtMoney(p.price))}</div>
                <div class="muted">${p.public ? '✓ ' + t('make_public') : '✕'}</div>
                <div class="row mt-2">
                  <button class="btn" data-act="toggle">${p.public ? 'Off' : t('make_public')}</button>
                  <button class="btn danger" data-act="del">${esc(t('delete'))}</button>
                </div>
              </div>
            </div>
          `).join('')}</div>`;

          worksEl.querySelectorAll('.card').forEach((card) => {
            const id = card.getAttribute('data-id');
            card.querySelector('[data-act="del"]').addEventListener('click', async () => {
              if (!confirm(t('confirm_delete'))) return;
              try {
                await api('/api/seller/products/' + encodeURIComponent(id), { method: 'DELETE' });
                toast(t('delete'), 'ok');
                renderWorks();
              } catch (e) { toast(t('error_generic'), 'error'); }
            });
            card.querySelector('[data-act="toggle"]').addEventListener('click', async (e) => {
              const btn = e.currentTarget;
              const isOn = btn.textContent !== t('make_public');
              try {
                await api('/api/seller/products/' + encodeURIComponent(id) + '/public', {
                  method: 'PATCH',
                  body: { isPublic: !isOn }
                });
                renderWorks();
              } catch { toast(t('error_generic'), 'error'); }
            });
          });
        } catch (e) {
          worksEl.innerHTML = `<p class="error-text">${esc(t('error_generic'))}</p>`;
        }
      }

      createBtn.addEventListener('click', async () => {
        msgEl.textContent = '';
        const name = nameEl.value.trim();
        const price = Number(priceEl.value);
        if (!name || name.length < 2) { msgEl.textContent = t('required'); return; }
        if (!Number.isFinite(price) || price <= 0) { msgEl.textContent = t('required'); return; }
        if (!pendingFile) { msgEl.textContent = t('image_required'); return; }
        createBtn.disabled = true;
        try {
          await api('/api/seller/products', {
            method: 'POST',
            body: {
              name, price,
              genre: genreEl.value,
              paymentType: paymentEl.value,
              imageBase64: pendingFile.base64,
              imageType: pendingFile.type,
              isPublic: !!pubEl.checked
            }
          });
          nameEl.value = ''; priceEl.value = '';
          fileEl.value = ''; pendingFile = null;
          preview.classList.add('hidden'); preview.src = '';
          pubEl.checked = true;
          toast(t('create'), 'ok');
          renderWorks();
        } catch (e) {
          msgEl.textContent = (e.data && e.data.error) || t('error_generic');
        } finally {
          createBtn.disabled = false;
        }
      });

      renderWorks();
    };
  </script>
</body>
</html>
