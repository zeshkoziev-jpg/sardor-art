<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mahsulot — SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="product">
  <div id="site-header"></div>
  <main class="container">
    <a href="/" class="muted" data-i18n="back">Orqaga</a>
    <div id="product-area" class="mt-2"></div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
  window.initProduct = async function () {
    const t = window.t;
    const area = document.getElementById('product-area');
    const params = new URLSearchParams(location.search);
    const id = params.get('id');

    if (!id) {
      area.innerHTML = <p class="muted">Asar ID si topilmadi.</p>;
      return;
    }
    
    try {
      const j = await api('/api/products/' + encodeURIComponent(id));
      const p = j.product;
      
      // Agar serverdan ma'lumot kelmasa
      if (!p) throw new Error('NOT_FOUND');

      area.innerHTML = `
        <div class="product-layout">
          <div class="product-media">
            <img src="${esc(p.image)}" alt="${esc(p.name)}">
            </div>
          <div class="product-info">
            <h1>${esc(p.name)}</h1>
            <div class="muted">${esc(p.sellerName || '')}</div>
            
            <div class="mt-2" style="background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; font-size:14px;">
              <div><b>Janr:</b> ${esc(p.genre || 'Boshqa')}</div>
              <div><b>To'lov sharti:</b> ${esc(p.paymentType || '100% oldindan')}</div>
            </div>

            <div class="price mt-2">${esc(fmtMoney(p.price))}</div>
            <div class="row mt-2">
              <button id="buy" class="btn primary" data-i18n="add_to_cart">${esc(t('add_to_cart'))}</button>
            </div>
          </div>
        </div>`
      ;
      document.getElementById('buy').addEventListener('click', () => {
        addToCart({ id: p.id, name: p.name, price: p.price, image: p.image, qty: 1 });
        toast(t('added'), 'ok');
      });
      applyTranslations();
    } catch (e) {
      console.error("Asarni yuklashda xato:", e); // Konsolga aniq xatoni chiqaradi
      if (e.status === 404 || e.message === 'NOT_FOUND') {
        area.innerHTML = 
          <div class="error-text mt-2">
            <p>Kechirasiz, bu asar topilmadi.</p>
            <p class="muted" style="font-size:12px">Ehtimol, server qayta ishga tushganda ma'lumotlar o'chib ketgan yoki asar savdogar tomonidan o'chirilgan.</p>
            <a href="/" class="btn mt-2">Bosh sahifaga qaytish</a>
          </div>
        ;
      } else {
        area.innerHTML = <p class="error-text">Tizimda xatolik yuz berdi. Iltimos, keyinroq urinib ko'ring.</p>;
      }
    }
  };
</script>
</body>
</html>
