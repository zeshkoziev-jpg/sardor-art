<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil — SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="profile">
  <div id="site-header"></div>
  <main class="container">
    <h1 data-i18n="profile_title">Profil</h1>
    <div id="profile-area"></div>
    <div class="mt-2" style="text-align: center;">
  <a href="./index.html" class="btn primary">Asarlarga o'tish</a>
</div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
    window.initProfile = function () {
      const t = window.t;
      const area = document.getElementById('profile-area');
      const user = getAuth();
      if (!user) {
        area.innerHTML = `
          <p class="muted">${esc(t('login_needed'))}</p>
          <a href="/login" class="btn primary mt-2">${esc(t('login_title'))}</a>
        `;
        return;
      }
      area.innerHTML = `
        <div class="sold-card">
          <div class="head">
            <div><b>${esc(user.phone)}</b></div>
            <div class="muted">${esc(t('role_saved'))}: <b>${esc(user.role === 'seller' ? t('seller_role') : t('customer'))}</b></div>
          </div>
          <h3 class="mt-2" data-i18n="choose_role">${esc(t('choose_role'))}</h3>
          <div class="row">
            <button id="role-customer" class="btn ${user.role === 'customer' ? 'primary' : ''}">${esc(t('customer'))}</button>
            <button id="role-seller" class="btn ${user.role === 'seller' ? 'primary' : ''}">${esc(t('seller_role'))}</button>
          </div>
          <div id="role-msg" class="muted mt-2"></div>
        </div>
        <div id="seller-shortcuts"></div>
      `;

      async function setRole(role) {
        try {
          await api('/api/profile/role', { method: 'POST', body: { role } });
          await refreshAuth();
          toast(t('role_saved'), 'ok');
          location.reload();
        } catch (e) {
          document.getElementById('role-msg').textContent = (e.data && e.data.error) || t('error_generic');
        }
      }
      document.getElementById('role-customer').addEventListener('click', () => setRole('customer'));
      document.getElementById('role-seller').addEventListener('click', () => setRole('seller'));

      if (user.role === 'seller') {
        document.getElementById('seller-shortcuts').innerHTML = `
          <div class="row mt-2">
            <a class="btn" href="/seller">${esc(t('seller_title'))}</a>
            <a class="btn" href="/sold">${esc(t('sold_title'))}</a>
          </div>
        `;
      }
    };
  </script>
</body>
</html>
