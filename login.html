<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — SARDOR ART</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="login">
  <div id="site-header"></div>
  <main class="container">
    <h1 data-i18n="login_title">Kirish</h1>
    <div class="form" style="text-align: center; margin-top: 40px;">
      <p class="muted">Tizimga kirish uchun Telegram botimizdan foydalaning.</p>
      <button id="tg-login" class="btn primary" style="font-size: 16px; padding: 15px 30px;">
        Telegram orqali kirish
      </button>
      <div id="msg" class="muted mt-2" style="font-weight: bold;"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/app.js"></script>
  <script>
    window.initLogin = function () {
      const btn = document.getElementById('tg-login');
      const msg = document.getElementById('msg');

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        msg.textContent = 'Telegramga yo\'naltirilmoqda...';
        try {
          const res = await api('/api/auth/telegram/init', { method: 'POST', body: {} });
          
          // Yangi oynada Telegram botni ochish
          window.open(res.url, '_blank');
          msg.textContent = 'Iltimos, Telegramda botga raqamingizni va kodni yuboring. Kutmoqdamiz...';

          // Har 2 soniyada serverdan holatni tekshirib turamiz (Polling)
          const interval = setInterval(async () => {
            try {
              const check = await api('/api/auth/telegram/check?token=' + res.token);
              if (check.ok) {
                clearInterval(interval);
                msg.textContent = 'Muvaffaqiyatli kirdingiz! O\'tilmoqda...';
                setTimeout(() => window.location.href = '/profile', 1000);
              }
            } catch (e) {
              // Xatolik bo'lsa kutishda davom etamiz
            }
          }, 2000);

          // 5 daqiqadan keyin kutishni to'xtatish (foydalanuvchi qaytmasa)
          setTimeout(() => { 
            clearInterval(interval); 
            btn.disabled = false; 
            msg.textContent = 'Vaqt tugadi. Qaytadan urinib ko\'ring.';
          }, 300000);

        } catch (e) {
          msg.textContent = 'Xatolik yuz berdi. Qaytadan urinib ko\'ring.';
          btn.disabled = false;
        }
      });
    };
  </script>
</body>
</html>
